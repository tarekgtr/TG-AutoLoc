# Render Blueprint for TG AutoLoc (https://render.com/docs/blueprint-spec).
# Free plan: the database is external (Neon) and photos go to an S3-compatible bucket (Cloudflare R2),
# because Render free services have no persistent disk. Step-by-step guide: deploy/render/README.md
# Values marked `sync: false` are asked for when you create the Blueprint; they are never stored in this file.

services:
  - type: web
    name: tg-autoloc-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: STORAGE_TYPE
        value: s3
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        value: auto
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_SECRET_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: FORWARD_HEADERS_STRATEGY
        value: native
      - key: API_DOCS_ENABLED
        value: "false"
      # First administrator; the password is generated by Render (see the service's Environment tab).
      # Delete both variables after the first login.
      - key: ADMIN_BOOTSTRAP_USERNAME
        value: admin
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      # Sized for the free instance (512 MB, 0.1 CPU); C1-only JIT starts faster.
      - key: JAVA_OPTS
        value: -Xmx300m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1

  - type: web
    name: tg-autoloc
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      # Both are also passed to the Docker build (the /api proxy target and the site URL are compiled in).
      # Example: https://tg-autoloc-api.onrender.com
      - key: BACKEND_INTERNAL_URL
        sync: false
      # Example: https://tg-autoloc.onrender.com (or your own domain)
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
