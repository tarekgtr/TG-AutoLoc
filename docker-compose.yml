# TG AutoLoc – local stack.
#   docker compose up -d db                 # PostgreSQL only (run backend/frontend from your IDE)
#   docker compose up -d --build            # full stack: http://localhost:3000
# Configuration comes from .env (copy .env.example). Data lives in named volumes and survives restarts.

name: tg-autoloc

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tgautoloc}
      POSTGRES_USER: ${DB_USERNAME:-tgautoloc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-tgautoloc}
      DB_USERNAME: ${DB_USERNAME:-tgautoloc}
      DB_PASSWORD: ${DB_PASSWORD}
      STORAGE_LOCAL_PATH: /data/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Trust X-Forwarded-For from the Next.js proxy (private network) for login rate limiting.
      FORWARD_HEADERS_STRATEGY: native
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      # Uploaded vehicle images: persistent across container restarts and rebuilds.
      - uploads:/data/uploads

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8080
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  db-data:
  uploads:
