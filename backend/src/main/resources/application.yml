spring:
  application:
    name: tg-autoloc-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tgautoloc}
    username: ${DB_USERNAME:tgautoloc}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Per-file limit is enforced by app.storage.max-file-size-bytes; these are the outer bounds.
      max-file-size: 10MB
      max-request-size: 60MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:2h}
      cookie:
        name: TGSESSION
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
        path: /

app:
  storage:
    # local = directory below (mount a persistent volume in Docker); s3 = S3-compatible bucket (Cloudflare R2, AWS S3...).
    type: ${STORAGE_TYPE:local}
    # Directory for uploaded vehicle images. Mount a persistent volume here in Docker/production.
    local-path: ${STORAGE_LOCAL_PATH:./data/uploads}
    s3:
      # e.g. https://<account-id>.r2.cloudflarestorage.com for Cloudflare R2; empty for AWS S3.
      endpoint: ${STORAGE_S3_ENDPOINT:}
      region: ${STORAGE_S3_REGION:auto}
      bucket: ${STORAGE_S3_BUCKET:}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:8388608}
    max-images-per-car: ${STORAGE_MAX_IMAGES_PER_CAR:20}
  security:
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:15m}
    # Initial administrator bootstrap: only used when the admin table is empty.
    bootstrap-admin:
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/docs/ui

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    dz.tgautoloc: INFO
